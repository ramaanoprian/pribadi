<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
html,body{width:140px;height:140px;background:transparent;overflow:hidden}.badge{position:absolute;left:10px;top:10px;width:120px;height:120px;border-radius:50%;
background:radial-gradient(circle,#1b6a80 0 58%,#2fb4c9 60%,#0e4d5f 100%);display:grid;place-items:center;box-shadow:0 6px 8px rgba(0,0,0,.3)}
.badge::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 70%);box-shadow:inset 0 -5px 8px rgba(0,0,0,.25)}
.badge svg{position:relative;width:42%;height:42%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}</style></head><body><div class="badge" style="--c:#2f9be0"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 19a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 8.5 4.5 4.5 0 0 1 17.5 19H7zm3.2-4.4 5.3-5.3-1.4-1.4-3.9 3.9-1.9-1.9-1.4 1.4 3.3 3.3z"/></svg></div></body></html>
